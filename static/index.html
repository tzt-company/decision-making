<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laya · System 1 决策台</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark">S1</div>
        <h1>Laya 决策台</h1>
      </div>
      <p class="brand-sub">多语言 · 非自回归 · 真模型 CPU</p>

      <p class="nav-label">场景</p>
      <div class="scenario-list" id="scenarioList"></div>

      <div class="meta-card">
        <div class="meta-row"><span>推理</span><span>laya Router</span></div>
        <div class="meta-row"><span>设备</span><span>CPU</span></div>
        <div class="meta-row"><span>原语</span><span>choice / score / noul</span></div>
        <div class="meta-row"><span>门控阈值</span><span id="railGate">0.85</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2 id="scnTitle">加载中…</h2>
          <p class="desc" id="scnDesc"></p>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="dot busy" id="statusDot"></span>
          <span id="statusText">检查引擎…</span>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">状态输入 · State</div>
          <div class="panel-title" id="stateKey"></div>
        </div>
        <div class="samples" id="sampleList"></div>
        <textarea id="stateText" placeholder="输入要判断的文本状态…"></textarea>
        <div class="controls">
          <div class="field">
            <label for="modelSelect">Checkpoint（可选覆盖）</label>
            <select id="modelSelect">
              <option value="">自动路由（推荐）</option>
              <option value="english">english · ModernBERT</option>
              <option value="multilingual">multilingual · mmBERT</option>
              <option value="typed-decisions">typed-decisions</option>
            </select>
          </div>
          <div class="field">
            <label>置信度门控阈值</label>
            <div class="range-wrap">
              <input type="range" id="gateRange" min="0.5" max="0.95" step="0.01" value="0.85" />
              <span class="range-val" id="gateVal">0.85</span>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btnRoute" type="button">仅看路由</button>
            <button class="btn btn-ghost" id="btnBatch" type="button">跑全部样例</button>
            <button class="btn btn-primary" id="btnRun" type="button">单次前向 · 判定</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">类型化问题 · 一次前向</div>
          <div class="panel-title" id="qCount"></div>
        </div>
        <div class="q-grid" id="questionList"></div>
      </section>

      <section class="panel" id="resultPanel">
        <div class="panel-head">
          <div class="panel-title">结构化结果 · Probabilities</div>
          <div class="panel-title" id="resultMeta">等待判定</div>
        </div>
        <div id="resultBody">
          <div class="empty">选择样例或输入文本，点击「单次前向 · 判定」。所有概率来自本机 Laya 真模型，无演示假数据。</div>
        </div>
      </section>
    </main>
  </div>

  <div class="flash" id="flash" hidden><span>ONE FORWARD PASS</span></div>
  <script src="/static/app.js"></script>
</body>
</html>
